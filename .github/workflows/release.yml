# Publishes a downloadable build when a version tag is pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The zip contains the game with the .NET runtime included, so players need nothing installed.
# Tags with a dash (for example v1.1.0-beta) are published as pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # One WhereAmI.exe with the runtime inside, a few native WPF DLLs next to it, and the Assets folder.
          dotnet publish src/WhereAmI/WhereAmI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=$version `
            -p:DebugType=None `
            --output publish/WhereAmI
          Compress-Archive -Path publish/WhereAmI -DestinationPath "WhereAmI-$tag-win-x64.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "Download **WhereAmI-$tag-win-x64.zip**, unzip it anywhere and run ``WhereAmI\WhereAmI.exe``.`n`nWindows 10 or 11, 64-bit. Nothing else needs to be installed."
          $options = @('--title', "Where Am I? $tag", '--notes', $notes, '--generate-notes')
          if ($tag.Contains('-')) { $options += '--prerelease' }
          gh release create $tag "WhereAmI-$tag-win-x64.zip" @options
